<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Commitment</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c1c1e">
</head>

<body>

    <div class="app">

        <header>
            <h1>My Commitment</h1>
            <p>September 2026</p>
        </header>

        <section class="summary">

            <div class="card">
                <span>Monthly Income</span>
                <strong>RM 3,100.00</strong>
            </div>

            <div class="card">
                <span>Total Commitment</span>
                <strong>RM 1,585.00</strong>
            </div>

            <div class="card">
                <span>This Month Saving</span>
                <strong>RM 650.00</strong>
            </div>

            <div class="card">
                <span>Saving Balance</span>
                <strong>RM 4,850.00</strong>
            </div>

        </section>

        <section class="commitments">

    <div class="section-title">
        <h2>Commitments</h2>
        <button onclick="addCommitment()">+ Add</button>
    </div>

    <div id="commitmentList">

        <div class="item">
            <span>🏠 Rent</span>
            <strong>RM 800</strong>
        </div>

        <div class="item">
            <span>🏍️ Motor</span>
            <strong>RM 200</strong>
        </div>

        <div class="item">
            <span>📚 PTPTN</span>
            <strong>RM 150</strong>
        </div>

        <div class="item">
            <span>🛒 Groceries</span>
            <strong>RM 350</strong>
        </div>

        <div class="item">
            <span>⛽ Petrol</span>
            <strong>RM 50</strong>
        </div>

        <div class="item">
            <span>🌐 Internet</span>
            <strong>RM 35</strong>
        </div>

    </div>

</section>

        <nav>
            <button>🏠<br>Home</button>
            <button>📅<br>Monthly</button>
            <button>💰<br>Savings</button>
            <button>⚙️<br>Settings</button>
        </nav>

    </div>

    <script src="app.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
    }
    
</script>

</body>
</html>
